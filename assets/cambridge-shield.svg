<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="144" viewBox="0 0 120 144" role="img" aria-labelledby="title description">
  <title id="title">Illustrated Cambridge shield</title>
  <desc id="description">A hand-drawn interpretation of the University of Cambridge coat of arms: a red shield, an ermine cross, four gold lions walking to the viewer's left, and a closed red book with gold clasps.</desc>
  <defs>
    <!-- One editable lion, repeated in all four quarters. The face looks outwards. -->
    <g id="lion" fill="#E5C477" stroke="#303337" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16 C27 12 28 8 25 5 Q21 3 24 1 Q29 1 30 7 Q32 15 25 20 Z"/>
      <path d="M9 12 Q14 10 18 14 L24 14 Q28 16 25 22 L24 27 L29 27 L29 30 L20 30 L20 23 L16 23 L12 27 L12 30 L6 30 L6 27 L9 25 L9 20 L6 18 L2 19 L1 16 L5 14 L8 16 Z"/>
      <path d="M5 4 Q8 1 11 5 Q15 4 15 8 L13 11 Q15 15 11 17 Q7 19 5 15 Q1 13 3 9 Q1 5 5 4 Z"/>
      <path d="M6 8 L6.3 8 M10.4 8 L10.7 8 M7.3 12 Q8.5 13 9.7 12" fill="none"/>
    </g>
    <!-- Sparse ermine tails retain their shape in greyscale and at small sizes. -->
    <g id="ermine" fill="#303337">
      <path d="M0 0 L-2 3 L0 5 L2 3 Z M-4 5 L-6 7 L-4 9 L-2 7 Z M4 5 L2 7 L4 9 L6 7 Z M0 7 Q-1 12 -4 15 L0 13 L4 15 Q1 12 0 7 Z"/>
    </g>
  </defs>
  <rect width="120" height="144" fill="#FFFFFF"/>
  <g id="shield-field">
    <path d="M10 9 Q60 7 110 10 L108 68 C106 101 86 124 60 138 C34 124 14 103 12 70 Z" fill="#AF5650"/>
    <path id="ermine-cross" d="M49 5 L70 5 L70 51 L113 51 L113 76 L70 76 L70 143 L49 143 L49 76 L7 76 L7 51 L49 51 Z" fill="#FFFFFF"/>
    <g id="lions">
      <use href="#lion" x="16" y="16"/>
      <use href="#lion" x="75" y="16"/>
      <use href="#lion" transform="translate(22 79) scale(.8)"/>
      <use href="#lion" transform="translate(72 79) scale(.8)"/>
    </g>
    <g id="ermine-marks">
      <use href="#ermine" x="59.5" y="17"/>
      <use href="#ermine" x="26" y="55"/>
      <use href="#ermine" x="93" y="55"/>
      <use href="#ermine" x="59.5" y="84"/>
      <use href="#ermine" x="59.5" y="108"/>
    </g>
    <g id="closed-book" stroke="#303337" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M43 55 Q59 53 77 55 L77 72 Q61 70 43 72 Z" fill="#E5C477"/>
      <path d="M44 53 Q61 51 77 53 L76 68 Q60 66 43 68 Z" fill="#AF5650"/>
      <path d="M47 57 Q60 55 73 57 L72 64 Q60 63 47 64 Z" fill="none" stroke="#E5C477"/>
      <path d="M49 66 L53 66 L53 74 L49 74 Z M66 66 L70 66 L70 73 L66 73 Z" fill="#E5C477"/>
    </g>
  </g>
  <path id="shield-outline" d="M10 9 Q60 7 110 10 L108 68 C106 101 86 124 60 138 C34 124 14 103 12 70 Z" fill="none" stroke="#303337" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
